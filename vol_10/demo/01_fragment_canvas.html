<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>vol_10 / 01 — フラグメントシェーダーで3Dメタボール</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    .label {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      opacity: 0.7;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    .overlay {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      width: 458px;
      height: 130px;
    }
    .overlay-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 1fr;
      gap: 6px;
      width: 100%;
      height: 100%;
    }
    .cell {
      position: relative;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    .cell canvas { width: 100%; height: 100%; }
    .cell-label {
      position: absolute;
      left: 0.35rem;
      bottom: 0.25rem;
      font-size: 0.65rem;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: 0.9;
      mix-blend-mode: difference;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="label">サンプル01：フラグメントシェーダーで3Dメタボール（レイマーチング）</div>
  <canvas id="c"></canvas>

  <div class="overlay">
    <div class="overlay-grid">
      <div class="cell"><canvas id="vis-trails"></canvas><div class="cell-label">center trails</div></div>
      <div class="cell"><canvas id="vis-sdf"></canvas><div class="cell-label">SDF (z=0)</div></div>
      <div class="cell"><canvas id="vis-depth"></canvas><div class="cell-label">depth</div></div>
      <div class="cell"><canvas id="vis-diffuse"></canvas><div class="cell-label">diffuse</div></div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ─── 共通の GLSL（本体と各可視化で共有） ───
    const CENTERS_GLSL = /* glsl */`
      void centers(float t, out vec3 c1, out vec3 c2, out vec3 c3, out vec3 c4) {
        c1 = vec3(0.7 * cos(t * 0.7),       0.7 * sin(t * 0.9),       0.3 * sin(t * 0.5));
        c2 = vec3(0.7 * sin(t * 0.8 + 1.0), 0.7 * cos(t * 0.6),       0.3 * cos(t * 0.7));
        c3 = vec3(0.7 * cos(t * 0.5 + 2.0), 0.7 * sin(t * 0.4 + 1.5), 0.3 * sin(t * 0.6 + 1.0));
        c4 = vec3(0.7 * sin(t * 0.6 + 3.0), 0.7 * cos(t * 0.8 + 2.5), 0.3 * cos(t * 0.5 + 2.0));
      }
    `;

    const SDF_GLSL = /* glsl */`
      float smin(float a, float b, float k) {
        // k=0 だとハードな min と等価
        if (k < 0.0001) return min(a, b);
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }
      float sdSphere(vec3 p, vec3 c, float r) { return length(p - c) - r; }
      float sceneK(vec3 p, float t, float k) {
        vec3 c1, c2, c3, c4; centers(t, c1, c2, c3, c4);
        float d = sdSphere(p, c1, 0.45);
        d = smin(d, sdSphere(p, c2, 0.45), k);
        d = smin(d, sdSphere(p, c3, 0.45), k);
        d = smin(d, sdSphere(p, c4, 0.45), k);
        return d;
      }
      float scene(vec3 p, float t) { return sceneK(p, t, 0.5); }
    `;

    const NORMAL_GLSL = /* glsl */`
      vec3 calcNormal(vec3 p, float t) {
        float e = 0.001;
        vec2 k = vec2(1.0, -1.0);
        return normalize(
          k.xyy * scene(p + k.xyy * e, t) +
          k.yyx * scene(p + k.yyx * e, t) +
          k.yxy * scene(p + k.yxy * e, t) +
          k.xxx * scene(p + k.xxx * e, t)
        );
      }
    `;

    const RAYMARCH_GLSL = /* glsl */`
      struct March { float t; int steps; bool hit; };
      March raymarch(vec3 ro, vec3 rd, float u_time) {
        float t = 0.0; int steps = 0; bool hit = false;
        for (int i = 0; i < 80; i++) {
          vec3 p = ro + rd * t;
          float d = scene(p, u_time);
          steps = i;
          if (d < 0.001) { hit = true; break; }
          if (t > 10.0) break;
          t += d;
        }
        return March(t, steps, hit);
      }
    `;

    const FULLSCREEN_VS = /* glsl */`
      void main() { gl_Position = vec4(position, 1.0); }
    `;

    // ─── 本体描画（最終出力は法線 RGB） ───
    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('c'),
      antialias: true,
    });
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const mainMaterial = new THREE.ShaderMaterial({
      uniforms: {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
      },
      vertexShader: FULLSCREEN_VS,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform vec2 u_resolution;
        uniform float u_time;
        ${CENTERS_GLSL}
        ${SDF_GLSL}
        ${NORMAL_GLSL}
        ${RAYMARCH_GLSL}
        void main() {
          vec2 uv = (gl_FragCoord.xy - u_resolution.xy * 0.5) / u_resolution.y;
          vec3 ro = vec3(0.0, 0.0, 3.0);
          vec3 rd = normalize(vec3(uv, -1.5));
          March m = raymarch(ro, rd, u_time);
          vec3 col = vec3(0.0);
          if (m.hit) {
            vec3 p = ro + rd * m.t;
            vec3 n = calcNormal(p, u_time);
            vec3 lightDir = normalize(vec3(0.6, 0.8, 0.5));
            float diff = max(dot(n, lightDir), 0.0);
            col = vec3(diff);
          }
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mainMaterial));

    // ─── 可視化パネル作成ユーティリティ ───
    const PANEL_SIZE = 110;
    function makeVisPanel(canvasId, fragmentBody) {
      const c = document.getElementById(canvasId);
      const r = new THREE.WebGLRenderer({ canvas: c, antialias: true });
      r.setSize(PANEL_SIZE, PANEL_SIZE);
      const s = new THREE.Scene();
      const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          u_time: { value: 0 },
          u_size: { value: PANEL_SIZE },
        },
        vertexShader: FULLSCREEN_VS,
        fragmentShader: /* glsl */`
          precision highp float;
          uniform float u_time;
          uniform float u_size;
          ${CENTERS_GLSL}
          ${SDF_GLSL}
          ${NORMAL_GLSL}
          ${RAYMARCH_GLSL}
          ${fragmentBody}
        `,
      });
      s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
      return { renderer: r, scene: s, camera: cam, material: mat };
    }

    // 1. SDF (z=0 平面の符号付き距離をそのまま色で表現)
    const visSdf = makeVisPanel('vis-sdf', /* glsl */`
      void main() {
        vec2 p2 = (gl_FragCoord.xy / u_size - 0.5) * 3.0;
        float d = scene(vec3(p2, 0.0), u_time);
        // d ≈ -0.5〜1.5 を 0〜1 に正規化して、赤(内)→青(外) に線形マップ
        float t = clamp((d + 0.5) / 2.0, 0.0, 1.0);
        vec3 col = mix(vec3(1.0, 0.3, 0.1), vec3(0.05, 0.15, 0.45), t);
        gl_FragColor = vec4(col, 1.0);
      }
    `);

    // depth（ヒットまでの距離 t を白黒で）
    const visDepth = makeVisPanel('vis-depth', /* glsl */`
      void main() {
        vec2 uv = gl_FragCoord.xy / u_size - 0.5;
        vec3 ro = vec3(0.0, 0.0, 3.0);
        vec3 rd = normalize(vec3(uv, -1.5));
        March m = raymarch(ro, rd, u_time);
        float depth = m.hit ? clamp(m.t / 5.0, 0.0, 1.0) : 1.0;
        gl_FragColor = vec4(vec3(1.0 - depth), 1.0);
      }
    `);

    // 球の軌跡（過去 2 秒分の中心位置を残像として描画）
    const visTrails = makeVisPanel('vis-trails', /* glsl */`
      void main() {
        vec2 uv = (gl_FragCoord.xy / u_size - 0.5) * 3.0;
        vec3 col = vec3(0.0);
        for (int i = 0; i < 40; i++) {
          float dt = float(i) / 40.0 * 2.0;
          float t = u_time - dt;
          vec3 c1, c2, c3, c4; centers(t, c1, c2, c3, c4);
          float alpha = 1.0 - dt / 2.0;
          float size = 0.05;
          col += vec3(1.00, 0.45, 0.45) * smoothstep(size, 0.0, length(uv - c1.xy)) * alpha;
          col += vec3(0.45, 1.00, 0.55) * smoothstep(size, 0.0, length(uv - c2.xy)) * alpha;
          col += vec3(0.45, 0.65, 1.00) * smoothstep(size, 0.0, length(uv - c3.xy)) * alpha;
          col += vec3(1.00, 0.90, 0.35) * smoothstep(size, 0.0, length(uv - c4.xy)) * alpha;
        }
        gl_FragColor = vec4(col, 1.0);
      }
    `);

    // diffuse（光源1つ：法線とライト方向のなす角でグレー陰影）
    const visDiffuse = makeVisPanel('vis-diffuse', /* glsl */`
      void main() {
        vec2 uv = gl_FragCoord.xy / u_size - 0.5;
        vec3 ro = vec3(0.0, 0.0, 3.0);
        vec3 rd = normalize(vec3(uv, -1.5));
        March m = raymarch(ro, rd, u_time);
        vec3 col = vec3(0.0);
        if (m.hit) {
          vec3 p = ro + rd * m.t;
          vec3 n = calcNormal(p, u_time);
          vec3 lightDir = normalize(vec3(0.6, 0.8, 0.5));
          float diff = max(dot(n, lightDir), 0.0);
          col = vec3(diff);
        }
        gl_FragColor = vec4(col, 1.0);
      }
    `);

    const visPanels = [
      visTrails, visSdf, visDepth, visDiffuse,
    ];

    const clock = new THREE.Clock();
    function loop() {
      requestAnimationFrame(loop);
      const t = clock.getElapsedTime();
      mainMaterial.uniforms.u_time.value = t;
      renderer.render(scene, camera);
      for (const v of visPanels) {
        v.material.uniforms.u_time.value = t;
        v.renderer.render(v.scene, v.camera);
      }
    }
    loop();

    window.addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      mainMaterial.uniforms.u_resolution.value.set(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
